

name: Build EnchantedItems

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Trouver le projet Maven
        run: find . -name pom.xml

      - name: Compiler le plugin
        run: mvn --batch-mode -f EnchantedItems/pom.xml clean package

      - name: Télécharger le JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnchantedItems
          path: EnchantedItems/target/*.jar

